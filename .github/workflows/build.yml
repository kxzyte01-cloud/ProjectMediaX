      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Unit Tests & Build Debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Single Installable APK
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/debug -name "*universal*.apk" -o -name "app-debug.apk" | sort | head -n 1)
          cp "$APK_FILE" dist/ProjectMediaX-debug.apk
          ls -lh dist/ProjectMediaX-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectMediaX-APK
          path: dist/ProjectMediaX-debug.apk

      - name: Publish Direct Download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.2.${{ github.run_number }}"
          gh release create "$TAG" dist/ProjectMediaX-debug.apk \
            --target "${{ github.sha }}" \
            --title "Project Media X APK (Build #${{ github.run_number }})" \
            --notes "Tap ProjectMediaX-debug.apk below under Assets on your Android phone to download and install."
