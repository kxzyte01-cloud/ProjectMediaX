          if [ -f "ProjectMediaX_M1_Ready.zip" ] && [ ! -f "settings.gradle.kts" ]; then
            unzip -q -o ProjectMediaX_M1_Ready.zip
            if [ -d "ProjectMediaX" ]; then cp -r ProjectMediaX/. . ; fi
          elif [ -f "ProjectMediaX_M0_Complete.zip" ] && [ ! -f "settings.gradle.kts" ]; then
